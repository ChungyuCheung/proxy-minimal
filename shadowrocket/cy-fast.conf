[Host]
# 内网域名与 .cn 域名锁定当前网络 DHCP 下发的系统 DNS，返回真实内网/本地 IP
*.cn = server:system
*.lan = server:system
*.local = server:system
*.internal = server:system
*.home.arpa = server:system
huitone.com = server:system
*.huitone.com = server:system

# [MITM] 保留最小化 HTTPS 解密开关以支持客户端外挂模块（如天气、定位等）
# 启用外部模块时其主机名会自动合并；CA 证书请在本机 Shadowrocket 内生成并信任
[MITM]
enable = true
h2 = true
hostname = weatherkit.apple.com, gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
